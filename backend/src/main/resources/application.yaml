spring:
  application:
    name: nexus-backend

  config:
    import: optional:file:../.env[.properties]     # loads .env from the project root

  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  modulith:
    events:
      republish-outstanding-events-on-restart: true   # crash recovery: resend unfinished events

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

  jackson:
    time-zone: Asia/Kolkata

server:
  port: ${SERVER_PORT:8080}       # ":8080" = default if the variable is missing

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

nexus:
  jwt:
    secret: ${JWT_SECRET}
    access-ttl: 15m
    refresh-ttl: 30d
    signup-ttl: 10m
  otp:
    ttl: 5m                 # OTP valid for 5 minutes
    resend-cooldown: 30s    # can't request a new OTP within 30s
    log-to-console: true    # DEV ONLY: prints OTP in logs. false once SMS works

  crypto:
    field-key: ${FIELD_ENCRYPTION_KEY}

  admin:
    phone: ${ADMIN_PHONE:}      # ":" = empty if missing → seeder does nothing

  inventory:
    stale-after: 7d
    time-zone: Asia/Kolkata
    default-city: bhopal          # pilot runs in one city
    default-radius-m: 2000        # 2 km if the app doesn't send a radius
    max-radius-m: 5000            # nobody searches 50 km for a tablet
    second-life:
      flag-within-days: 2          # items expiring today/tomorrow/day after show up
      default-discount-pct: 30     # suggested save-it price = 30% off
      donate-at: "17:00"           # doc story: "at 5 pm the last five are offered to an NGO"

  reservation:
    hold-duration: 30m          # doc: "held for 30 minutes"
    max-active-per-user: 3      # stop one person locking a whole shelf
    sweep-every-ms: 60000       # safety net: check for missed expiries every minute