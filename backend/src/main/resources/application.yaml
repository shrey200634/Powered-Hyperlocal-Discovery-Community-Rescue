spring:
  application:
    name: nexus-backend

  config:
    import: optional:file:../.env[.properties]     # loads .env from the project root

  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  modulith:
    events:
      republish-outstanding-events-on-restart: true   # crash recovery: resend unfinished events

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

  jackson:
    time-zone: Asia/Kolkata

server:
  port: ${SERVER_PORT:8080}       # ":8080" = default if the variable is missing

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

nexus:
  jwt:
    secret: ${JWT_SECRET}
    access-ttl: 15m
    refresh-ttl: 30d
    signup-ttl: 10m
  otp:
    ttl: 5m                 # OTP valid for 5 minutes
    resend-cooldown: 30s    # can't request a new OTP within 30s
    log-to-console: true    # DEV ONLY: prints OTP in logs. false once SMS works

  crypto:
    field-key: ${FIELD_ENCRYPTION_KEY}

  admin:
    phone: ${ADMIN_PHONE:}      # ":" = empty if missing → seeder does nothing

  inventory:
    stale-after: 7d          # doc 10 + 12: shop hidden from search if stock not confirmed in 7 days
    time-zone: Asia/Kolkata  # for "open now"